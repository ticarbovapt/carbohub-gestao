name: Deploy Supabase Edge Functions

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Deploy Edge Functions
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -e

          # ⚠️ Publicação com repetição.
          #
          # Um deploy inteiro já falhou porque o esm.sh devolveu 522 (timeout
          # do Cloudflare) ao baixar o supabase-js. Como as funções sobem em
          # SEQUÊNCIA e o `set -e` aborta na primeira falha, um soluço de
          # alguns segundos numa CDN derrubou tudo que vinha depois — e o pior:
          # em silêncio, do ponto de vista de quem estava esperando a função
          # nova aparecer. Ficou parecendo bug de código.
          #
          # Três tentativas com espera crescente resolvem a classe inteira
          # desse problema: falha de rede é transitória, falha de código não.
          dep() {
            local fn="$1"; shift
            local tentativa
            for tentativa in 1 2 3; do
              if supabase functions deploy "$fn" \
                   --project-ref ${{ secrets.SUPABASE_PROJECT_ID }} "$@"; then
                return 0
              fi
              echo "::warning::deploy de $fn falhou (tentativa $tentativa/3)"
              sleep $((tentativa * 10))
            done
            echo "::error::deploy de $fn falhou nas 3 tentativas"
            return 1
          }

          dep bling-auth --no-verify-jwt
          dep bling-sync --no-verify-jwt
          # Bling 2 — segunda conta. --no-verify-jwt em todas: a auth e a sync
          # validam o JWT por dentro, e a auto-sync é chamada pelo pg_cron, que
          # manda só o X-Cron-Secret e nenhum Authorization.
          dep bling2-auth --no-verify-jwt
          dep bling2-sync --no-verify-jwt
          dep bling2-auto-sync --no-verify-jwt
          dep melhor-envio-quote --no-verify-jwt
          dep superfrete-quote --no-verify-jwt
          dep create-team-member --no-verify-jwt
          dep ecommerce-webhook --no-verify-jwt
          dep ecommerce-sync --no-verify-jwt
          # Rastreio do Melhor Envio (Jadlog + Correios). --no-verify-jwt porque
          # quem chama é o pg_cron, que manda só o X-Cron-Secret e nenhum
          # Authorization — a função valida o segredo por dentro.
          dep rastreio-sync --no-verify-jwt
          # OAuth do Melhor Envio. --no-verify-jwt porque quem abre é o
          # NAVEGADOR (a URL de retorno cadastrada no aplicativo), sem JWT.
          dep melhor-envio-auth --no-verify-jwt
          # Webhook do Melhor Envio: quem chama é ELE, sem JWT. O segredo vai
          # na query, porque o painel dele só aceita uma URL.
          dep melhor-envio-webhook --no-verify-jwt
          # Aviso ao cliente a cada movimentação da esteira. Chamada pelo
          # pg_cron, que manda só o X-Cron-Secret e nenhum Authorization.
          dep kanban-n8n --no-verify-jwt
          # A esteira da compra à entrega, pela Cloud API oficial da Meta.
          # Chamada pelo pg_cron (X-Cron-Secret, sem Authorization). Nasce sem
          # efeito: a fila só entrega etapa `meta` com template APPROVED e o
          # `ativo` de cada template continua false.
          dep whatsapp-meta --no-verify-jwt
          # Webhook da Meta: quem chama é ELA, sem JWT. E sem X-Cron-Secret —
          # o painel dela não deixa mandar header. Quem autentica é a assinatura
          # X-Hub-Signature-256, conferida por dentro.
          dep whatsapp-meta-webhook --no-verify-jwt
          # Resposta em texto livre, no atendimento. SEM --no-verify-jwt de
          # proposito: quem chama e o NAVEGADOR, por gente logada, e escrever
          # pelo numero da CarboZe nao pode depender de um segredo que anda na
          # URL. A funcao ainda confere se o perfil tem interface interna --
          # o portal de lojas usa a mesma tabela profiles.
          dep whatsapp-responder
          # Mensagens agendadas. Chamada pelo pg_cron (X-Cron-Secret, sem JWT).
          # Confere a janela de 24h no INSTANTE do envio -- entre agendar e
          # disparar passam horas, e mandar as cegas depois de esperar e pior
          # que nao ter agendado.
          dep whatsapp-agendadas --no-verify-jwt
          # Evolution (QR / desconectar). SEM --no-verify-jwt de propósito:
          # é chamada pelo NAVEGADOR, por gente logada, e derrubar o WhatsApp
          # da empresa não pode depender de um segredo que anda na URL.
          dep evolution-instancia
          dep ml-auth --no-verify-jwt
          dep nuvemshop-auth --no-verify-jwt
          dep nuvemshop-lgpd --no-verify-jwt
          # ⚠️ Esta lista é MANUAL: função que não aparece aqui simplesmente
          # nunca sobe, e o sintoma é a migração rodar, o cron marcar
          # `succeeded` e a tabela continuar vazia — sem erro em lugar nenhum.
          # Chamada pelo pg_cron, que manda X-Cron-Secret e nenhum Authorization.
          dep nuvemshop-carrinhos --no-verify-jwt
          # Fase 1 da integração do Melhor Envio: espelha os envios sem passar
          # pelo Bling. Só GET, chamada pelo pg_cron (X-Cron-Secret, sem JWT).
          dep melhor-envio-envios --no-verify-jwt
          # Fase 3: a UNICA que escreve na loja. Nasce desligada e em dry-run
          # (carbo_fulfill_config); publicar nao liga nada.
          dep nuvemshop-fulfill --no-verify-jwt
          dep ai-chat
          dep text-enhancer
