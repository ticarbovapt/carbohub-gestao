name: sql-supabase

# SQL no banco de produção SEM colar no SQL Editor.
#   · push na `main` que ADICIONA arquivo em supabase/aplicar/ → roda cada um, em ordem
#     de nome, uma única vez (só arquivo ADICIONADO roda; editar um já rodado não repete);
#   · disparo manual (workflow_dispatch) de qualquer arquivo permitido.
# Cada arquivo vai numa chamada só = UMA transação: falhou, nada muda e o job fica
# vermelho. Usa o mesmo SUPABASE_ACCESS_TOKEN que já faz o deploy das funções.
#
# ⚠️ RAISE NOTICE não volta pela API — termine o arquivo com um SELECT para ver
# resultado. ⚠️ O log mostra o resultado: nunca consulte segredo (token, CRON_SECRET).

on:
  push:
    branches: [main]
    paths: ['supabase/aplicar/**']
  workflow_dispatch:
    inputs:
      arquivo:
        description: 'Caminho do .sql (supabase/aplicar|migrations|consultas/…)'
        required: true
        type: string

concurrency:
  group: sql-supabase
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  rodar:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Rodar
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
          MANUAL: ${{ inputs.arquivo }}
          ANTES: ${{ github.event.before }}
          DEPOIS: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ -n "${MANUAL:-}" ]; then
            .github/scripts/rodar-sql.sh "$MANUAL"
            exit 0
          fi
          if [[ "$ANTES" =~ ^0+$ ]]; then ANTES="$(git rev-list --max-parents=0 "$DEPOIS" | tail -1)"; fi
          mapfile -t novos < <(git diff --name-only --diff-filter=A "$ANTES" "$DEPOIS" -- supabase/aplicar | sort)
          if [ "${#novos[@]}" -eq 0 ]; then echo "nenhum arquivo novo em supabase/aplicar"; exit 0; fi
          printf 'a rodar, em ordem:\n'; printf ' - %s\n' "${novos[@]}"
          for f in "${novos[@]}"; do .github/scripts/rodar-sql.sh "$f"; done
